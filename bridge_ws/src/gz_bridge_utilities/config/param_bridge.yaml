# Full set of configurations
- ros_topic_name: "/gazebo/model/state"
  gz_topic_name: "/model/x500_depth_0/pose"
  ros_type_name: "geometry_msgs/msg/PoseArray"
  gz_type_name: "gz.msgs.Pose_V"
  # subscriber_queue: 5       # Default 10 if qos_profile is empty, otherwise not set by default
  # publisher_queue: 6        # Default 10 if qos_profile is empty, otherwise not set by default
  # lazy: true                # Default "false"
  direction: GZ_TO_ROS  # Default "BIDIRECTIONAL" - Bridge both directions
                            # "GZ_TO_ROS" - Bridge Gz topic to ROS
                            # "ROS_TO_GZ" - Bridge ROS topic to Gz
  # qos_profile: SENSOR_DATA  # Default is a default-constructed QoS with appropriate queue size

- ros_topic_name: "/matte/camera_info"
  gz_topic_name: "/model/x500_depth_0/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

- ros_topic_name: "/matte/depth_camera/points"
  gz_topic_name: "/matte/depth_camera/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

- ros_topic_name: "/tf"
  gz_topic_name: "/model/x500_depth_0/pose"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS